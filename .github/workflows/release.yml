name: Release emulator

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example, v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: emulator-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check tag name
        run: |
          if [[ "$RELEASE_TAG" != v* ]] || ! git check-ref-format "refs/tags/$RELEASE_TAG"; then
            echo "Enter a valid Git tag that starts with v."
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
            binary: siliconcraft-emulator
          - platform: windows-x86_64
            runner: windows-2022
            binary: siliconcraft-emulator.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux SDL3 development dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libusb-1.0-0-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal

      - name: Test release build
        run: cargo +1.100.0 test --release --locked

      - name: Build emulator
        run: cargo +1.100.0 build --release --locked

      - name: Archive Linux binary
        if: runner.os == 'Linux'
        env:
          ASSET: siliconcraft-emulator-${{ matrix.platform }}.tar.gz
          BINARY: ${{ matrix.binary }}
        run: |
          mkdir package
          cp "target/release/$BINARY" README.md package/
          tar -czf "$ASSET" -C package "$BINARY" README.md

      - name: Archive Windows binary
        if: runner.os == 'Windows'
        env:
          ASSET: siliconcraft-emulator-${{ matrix.platform }}.zip
          BINARY: ${{ matrix.binary }}
        run: Compress-Archive -Path "target/release/$env:BINARY", README.md -DestinationPath $env:ASSET

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: siliconcraft-emulator-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish Windows and Linux together
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or verify the tag at the built commit
        run: |
          ref="refs/tags/$RELEASE_TAG"
          built_commit=$(git rev-parse HEAD)
          refs=$(git ls-remote origin "$ref" "$ref^{}")
          tag_commit=$(awk -v ref="$ref" '$2 == ref { print $1 }' <<< "$refs")
          peeled_commit=$(awk -v ref="$ref^{}" '$2 == ref { print $1 }' <<< "$refs")
          if [[ -z "$tag_commit" ]]; then
            if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
              echo "The release tag was removed before publication."
              exit 1
            fi
            git push origin "$built_commit:$ref"
          elif [[ "${peeled_commit:-$tag_commit}" != "$built_commit" ]]; then
            echo "This tag already points to a different commit."
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            release-assets/siliconcraft-emulator-linux-x86_64.tar.gz \
            release-assets/siliconcraft-emulator-windows-x86_64.zip
